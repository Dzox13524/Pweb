<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container mt-5 mb-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <form
            id="registrationForm"
            action="hasil-form.html"
            method="get"
            class="form-container"
          >
            <h2 class="mb-4 form-title">Register</h2>

            <div class="mb-3">
              <label for="namaLengkap" class="form-label">Full Name</label>
              <input
                type="text"
                class="form-control"
                id="namaLengkap"
                name="nama"
                placeholder="Enter your name"
                required
              />
            </div>
            <div class="mb-3">
              <label for="umur" class="form-label">Age</label>
              <input
                type="number"
                class="form-control"
                id="umur"
                name="umur"
                placeholder="e.g., 20"
                required
              />
            </div>
            <div class="mb-3">
              <label for="jurusan" class="form-label">Major</label>
              <select class="form-select" id="jurusan" name="jurusan" required>
                <option value="">-- Select Major --</option>
                <option value="Teknik Informatika">Teknik Informatika</option>
                <option value="Sistem Informasi">Sistem Informasi</option>
                <option value="DKV">Desain Komunikasi Visual</option>
              </select>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="provinsi" class="form-label">Province</label>
                <select class="form-select" id="provinsi" required>
                  <option value="">-- Select Province --</option>
                  <option value="Jawa Timur">Jawa Timur</option>
                  <option value="Jawa Tengah">Jawa Tengah</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label for="kota" class="form-label">City</label>
                <select
                  class="form-select"
                  id="kota"
                  name="kota"
                  disabled
                  required
                >
                  <option value="">-- Select province first --</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label for="alamat" class="form-label">Address</label>
              <textarea
                class="form-control"
                id="alamat"
                name="alamat"
                rows="3"
                placeholder="Enter your address"
              ></textarea>
            </div>
            <div class="mb-3">
              <label for="berkas" class="form-label">Upload CV</label>
              <input
                class="form-control"
                type="file"
                id="berkas"
                name="berkas"
              />
            </div>
            <div class="mb-3">
              <label class="form-label">Gender</label>
              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="jenisKelamin"
                  id="pria"
                  value="Pria"
                  required
                />
                <label class="form-check-label" for="pria">Male</label>
              </div>
              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="jenisKelamin"
                  id="wanita"
                  value="Wanita"
                />
                <label class="form-check-label" for="wanita">Female</label>
              </div>
            </div>
            <div class="mb-3 text-center">
              <label class="form-label">Digital Signature</label>
              <canvas
                id="myCanvas"
                width="400"
                height="150"
                class="border rounded"
              ></canvas>
              <button
                type="button"
                id="clearCanvas"
                class="btn btn-secondary btn-sm mt-2"
              >
                Clear Signature
              </button>
            </div>
            <div class="mb-3 form-check">
              <input
                type="checkbox"
                class="form-check-input"
                id="persetujuan"
                name="persetujuan"
                value="setuju"
                required
              />
              <label class="form-check-label" for="persetujuan"
                >I agree to the terms and conditions</label
              >
            </div>
            <button type="submit" class="btn btn-primary mt-3">
              Submit Data
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
      $(document).ready(function () {
        const dataKota = {
          "Jawa Timur": ["Surabaya", "Malang", "Jember"],
          "Jawa Tengah": ["Semarang", "Solo", "Magelang"],
        };
        $("#provinsi").on("change", function () {
          const provinsiTerpilih = $(this).val();
          const comboKota = $("#kota");
          comboKota.empty();
          if (provinsiTerpilih) {
            comboKota.prop("disabled", false);
            comboKota.append('<option value="">-- Select City --</option>');
            dataKota[provinsiTerpilih].forEach(function (kota) {
              comboKota.append(`<option value="${kota}">${kota}</option>`);
            });
          } else {
            comboKota.prop("disabled", true);
            comboKota.append("<option>-- Select province first --</option>");
          }
        });

        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");
        const clearButton = document.getElementById("clearCanvas");
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        function draw(e) {
          if (!isDrawing) return;
          const rect = canvas.getBoundingClientRect();
          const x = e.offsetX || e.touches[0].clientX - rect.left;
          const y = e.offsetY || e.touches[0].clientY - rect.top;
          ctx.strokeStyle = "#000";
          ctx.lineWidth = 2;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.beginPath();
          ctx.moveTo(lastX, lastY);
          ctx.lineTo(x, y);
          ctx.stroke();
          [lastX, lastY] = [x, y];
        }
        function startDrawing(e) {
          isDrawing = true;
          const rect = canvas.getBoundingClientRect();
          [lastX, lastY] = [
            e.offsetX || e.touches[0].clientX - rect.left,
            e.offsetY || e.touches[0].clientY - rect.top,
          ];
        }
        canvas.addEventListener("mousedown", startDrawing);
        canvas.addEventListener("mousemove", draw);
        canvas.addEventListener("mouseup", () => (isDrawing = false));
        canvas.addEventListener("mouseleave", () => (isDrawing = false));
        canvas.addEventListener("touchstart", startDrawing);
        canvas.addEventListener("touchmove", draw);
        canvas.addEventListener("touchend", () => (isDrawing = false));
        if (clearButton) {
          clearButton.addEventListener("click", () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          });
        }

        $("#registrationForm").on("submit", function (e) {
          e.preventDefault();

          const signatureDataUrl = canvas.toDataURL("image/png");
            const fileInput = $("#berkas")[0];
            const fileName =
              fileInput.files.length > 0
                ? fileInput.files[0].name
                : "Tidak diunggah";
            const fileUrl = fileInput.files.length > 0
                ? URL.createObjectURL(fileInput.files[0])
                : "Tidak diunggah";

          const formData = {
            nama: $("#namaLengkap").val(),
            umur: $("#umur").val(),
            jurusan: $("#jurusan").val(),
            kota: $("#kota").val(),
            jenisKelamin: $('input[name="jenisKelamin"]:checked').val(),
            fileName: fileName,
            fileUrl: fileUrl,
            signature: signatureDataUrl,
            timestamp: new Date().toISOString(),
          };

          sessionStorage.setItem(
            "dataRegistrasi",
            JSON.stringify(formData)
          );

          window.location.href = "hasil-form.html";
        });
      });
    </script>
  </body>
</html>
