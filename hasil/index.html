<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Registrasi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.bootstrap5.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/3.0.2/css/buttons.bootstrap5.css">
    <style>
        body {
            background-color: #0d0d0d;
            color: #f0f0f0;
        }
        .card {
            background-color: #1a1a1a;
            border-color: #444;
        }
        .table-dark {
            --bs-table-bg: #212529;
            --bs-table-border-color: #444;
        }
        .dt-buttons .btn-secondary {
            background-color: #8a2be2;
            border-color: #8a2be2;
        }
    </style>
</head>
<body>

<div class="container mt-5 mb-5">
    <div class="card p-4">
        <h2 class="text-center mb-4" style="color: #e808ff;">Data Registrasi Mahasiswa</h2>
        <p class="text-center text-muted">Setiap data yang Anda kirim akan tersimpan di tabel ini (menggunakan Local Storage).</p>
        
        <table id="hasilTabel" class="table table-dark table-striped table-hover" style="width:100%">
            <thead>
                <tr>
                    <th>Nama Lengkap</th>
                    <th>Umur</th>
                    <th>Jurusan</th>
                    <th>Kota</th>
                    <th>Gender</th>
                </tr>
            </thead>
            <tbody id="data-container">
                </tbody>
        </table>

        <div class="mt-4 text-center">
            <a href="index.html" class="btn btn-primary">Kembali ke Form</a>
            <button id="resetData" class="btn btn-danger">Reset Data</button>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.0.8/js/dataTables.js"></script>
<script src="https://cdn.datatables.net/2.0.8/js/dataTables.bootstrap5.js"></script>
<script src="https://cdn.datatables.net/buttons/3.0.2/js/dataTables.buttons.js"></script>
<script src="https://cdn.datatables.net/buttons/3.0.2/js/buttons.bootstrap5.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<script src="https://cdn.datatables.net/buttons/3.0.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/3.0.2/js/buttons.print.min.js"></script>

<script>
$(document).ready(function() {
    let dataRegistrasi = JSON.parse(localStorage.getItem('dataRegistrasi')) || [];
    const params = new URLSearchParams(window.location.search);
    const namaBaru = params.get('nama');

    if (namaBaru) {
        const dataBaru = {
            nama: namaBaru,
            umur: params.get('umur'),
            jurusan: params.get('jurusan'),
            kota: params.get('kota'),
            jenisKelamin: params.get('jenisKelamin')
        };
        dataRegistrasi.push(dataBaru);
        
        localStorage.setItem('dataRegistrasi', JSON.stringify(dataRegistrasi));

        window.history.replaceState({}, document.title, window.location.pathname);
    }
    
    const dataContainer = $('#data-container');
    dataRegistrasi.forEach(data => {
        const row = `<tr>
            <td>${data.nama}</td>
            <td>${data.umur}</td>
            <td>${data.jurusan}</td>
            <td>${data.kota}</td>
            <td>${data.jenisKelamin}</td>
        </tr>`;
        dataContainer.append(row);
    });

    new DataTable('#hasilTabel', {
        layout: {
            topStart: {
                buttons: ['copy', 'csv', 'excel', 'pdf', 'print']
            }
        }
    });

    $('#resetData').on('click', function() {
        if (confirm('Apakah Anda yakin ingin menghapus semua data?')) {
            localStorage.removeItem('dataRegistrasi');
            alert('Semua data telah dihapus.');
            location.reload();
        }
    });
});
</script>

</body>
</html>
